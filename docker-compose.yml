services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=ec2,ecs,eks,lambda,s3,rds,dynamodb,elasticache,sqs,sns,events,iam,elbv2,route53
      - DEFAULT_REGION=us-east-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"

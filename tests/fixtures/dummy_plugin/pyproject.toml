# Test-only scanner plugin. Proves a connector can be added from a separate package,
# registered through the `sherpa.scanners` entry point, with no change to Sherpa's core.
# Installed in CI:  pip install -e tests/fixtures/dummy_plugin

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sherpa-dummy-plugin"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."sherpa.scanners"]
"dummy-code" = "sherpa_dummy_plugin:DummyCodeScanner"

[tool.hatch.build.targets.wheel]
packages = ["sherpa_dummy_plugin"]

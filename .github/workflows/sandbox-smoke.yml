name: Sandbox smoke test

# Proves the sandbox bootstrap (infra/sandbox/) works: OIDC sign-in, role hops into every
# target account, the SCP guardrails, and a real multi-account Sherpa scan. Creates nothing.
# Manual only. The repo is public, so account IDs are masked and no snapshot is uploaded.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sandbox
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: sandbox
    timeout-minutes: 20
    env:
      CI_ACCOUNT: ${{ vars.SANDBOX_CI_ACCOUNT_ID }}
      TARGETS: ${{ vars.SANDBOX_TARGET_ACCOUNT_IDS }}
      SHERPA_AWS_EXTERNAL_ID: ${{ vars.SANDBOX_EXTERNAL_ID }}
    steps:
      - name: Mask account IDs
        run: |
          for id in $CI_ACCOUNT ${TARGETS//,/ }; do echo "::add-mask::$id"; done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Sherpa
        run: pip install -e .

      # Diagnostics for "Not authorized to perform sts:AssumeRoleWithWebIdentity": the
      # role's trust policy must match these claims exactly. Prints claims, never the token.
      - name: Show OIDC token claims
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          base64 -d <<<"$payload" | jq '{sub, aud, repository, environment, ref}'
          echo "The SherpaRefCi trust policy expects sub = repo:${{ github.repository }}:environment:sandbox"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.SANDBOX_CI_ACCOUNT_ID }}:role/sherpa-ref/SherpaRefCi
          role-session-name: sherpa-smoke-${{ github.run_id }}
          aws-region: us-east-1

      - name: Smoke test
        run: infra/sandbox/smoke.sh
